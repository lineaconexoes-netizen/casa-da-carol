<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6D1A36">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Casa da Carol">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Casa da Carol</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: cabeçalho com saudação, barra de seções e um painel por seção; cartões só onde agrupam algo */
:root{
  --creme:#F5EFE6;--bege:#E6D5C3;--areia:#C9A98B;--caramelo:#A47551;--cafe:#5C3D2E;--marsala:#955251;--bordo:#6D1A36;
  --bg:#F3ECE3;--surface:#FFFFFF;--line:#E6D5C3;--ink:#5C3D2E;--soft:#8A6A55;--accent:#6D1A36;--accent2:#955251;--warm:#A47551;--onaccent:#F5EFE6;--chip:#EFE4D6;
  --ok:#5E7A4E;--warn:#B07A2A;--bad:#A3343A;
  --f-title:'Plus Jakarta Sans',system-ui,sans-serif;--f-sub:'Plus Jakarta Sans',system-ui,sans-serif;--f-body:'Plus Jakarta Sans',system-ui,sans-serif;--f-sig:'Plus Jakarta Sans',system-ui,sans-serif;--shadow:0 1px 2px rgba(92,61,46,.06),0 6px 20px rgba(92,61,46,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231915;--surface:#2E211B;--line:#4A3529;--ink:#F0E5D8;--soft:#C9A98B;--accent:#D88A93;--accent2:#C9877F;--warm:#C9A98B;--onaccent:#231915;--chip:#3A2A22;--ok:#9DBA86;--warn:#E0B060;--bad:#E58C8C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#231915;--surface:#2E211B;--line:#4A3529;--ink:#F0E5D8;--soft:#C9A98B;--accent:#D88A93;--accent2:#C9877F;--warm:#C9A98B;--onaccent:#231915;--chip:#3A2A22;--ok:#9DBA86;--warn:#E0B060;--bad:#E58C8C;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--areia);padding-bottom:14px}
h1{font-family:var(--f-title);font-weight:600;color:var(--accent);font-size:clamp(28px,5vw,40px);margin:0;line-height:1.1;text-wrap:balance}
.date{font-family:var(--f-sub);font-style:italic;font-size:19px;color:var(--warm)}
.sig{font-family:var(--f-sig);font-size:26px;color:var(--accent2)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding:10px 0;margin-bottom:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs a{flex:none;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;color:var(--soft);text-decoration:none;font-family:var(--f-sub);font-weight:600;font-size:17px;letter-spacing:.3px}
nav.tabs a svg{width:18px;height:18px}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--onaccent)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
h2{font-family:var(--f-title);font-weight:500;font-size:24px;margin:22px 0 4px;color:var(--ink);text-wrap:balance}
h3{font-family:var(--f-sub);font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:15px;color:var(--accent);margin:0 0 10px;display:flex;align-items:center;gap:8px}
h3 svg{width:18px;height:18px}
.lead{font-family:var(--f-sub);font-style:italic;font-size:18px;color:var(--soft);margin:0 0 14px}
.grid{display:grid;gap:14px;align-items:start;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
ul.items li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.muted{color:var(--soft);font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--chip);color:var(--soft);white-space:nowrap}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--onaccent);border-radius:999px;padding:6px 14px;font-family:var(--f-sub);font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--accent)}
.icon-btn{border:0;background:transparent;color:var(--soft);padding:2px 6px;border-radius:6px;font-size:13px}
.icon-btn:hover{color:var(--accent)}
.icon-btn.danger{color:var(--bad)}
.check{flex:none;width:20px;height:20px;border:1.5px solid var(--warm);border-radius:5px;background:transparent;display:grid;place-items:center;padding:0;color:var(--onaccent);margin-top:1px}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on::after{content:"";width:9px;height:5px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg) translate(1px,-1px)}
.done{text-decoration:line-through;color:var(--soft)}
.ico{flex:none;width:22px;height:22px;color:var(--accent2)}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent2);border-radius:99px}
.bar>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.bar.over>i{background:var(--bad)}
.stat{font-family:var(--f-title);font-size:26px;color:var(--ink)}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.empty{color:var(--soft);font-style:italic;font-size:14px;padding:6px 0}
.hgrid{overflow-x:auto}
.hgrid table{border-collapse:collapse;font-size:12px}
.hgrid th,.hgrid td{padding:2px;text-align:center}
.hgrid th.n{text-align:left;padding-right:10px;font-weight:500;white-space:nowrap;font-size:13.5px}
.hgrid td button{width:20px;height:20px;border-radius:4px;border:1px solid var(--line);background:transparent;padding:0}
.hgrid td button.on{background:var(--accent2);border-color:var(--accent2)}
.hgrid td.today button{border-color:var(--accent)}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h span{text-align:center;font-family:var(--f-sub);font-weight:600;color:var(--soft);font-size:14px;text-transform:uppercase;letter-spacing:1px}
.cd{min-height:84px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);padding:4px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0;overflow:hidden}
.cd.out{border:0}
.cd .dn{font-size:13px;color:var(--soft)}
.cd.hoje .dn{color:var(--onaccent);background:var(--accent);border-radius:99px;padding:0 6px;align-self:flex-start}
.cd.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ev{display:block;font-size:11px;line-height:1.3;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.ag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.ev.conta{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.ev.cuid{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.more{font-size:11px;color:var(--soft)}
@media (max-width:560px){.cd{min-height:52px;align-items:center}.cd .ev{width:7px;height:7px;padding:0;border-radius:99px;font-size:0;display:inline-block}.cd{flex-direction:row;flex-wrap:wrap;align-content:flex-start;justify-content:center}.cd .dn{width:100%;text-align:center}.cd.hoje .dn{width:auto}.more{font-size:10px}.cd .ev.ag{background:var(--accent)}.cd .ev.conta{background:var(--warn)}.cd .ev.cuid{background:var(--ok)}}

/* visual moderno */
body{font-size:15px;letter-spacing:-.005em}
h1{font-weight:800;letter-spacing:-.03em;font-size:clamp(26px,4.5vw,36px)}
.date{font-style:normal;font-size:15px;font-weight:500;color:var(--soft)}
.sig{display:none}
header.top{border-bottom:0;padding-bottom:6px}
nav.tabs{border-bottom:0;gap:6px}
nav.tabs a{font-size:14px;font-weight:600;letter-spacing:0;padding:8px 14px;background:var(--surface);box-shadow:var(--shadow)}
nav.tabs a[aria-current="page"]{box-shadow:none}
h2{font-weight:800;letter-spacing:-.02em;font-size:24px}
h3{text-transform:none;letter-spacing:-.01em;font-size:15px;font-weight:700;color:var(--ink)}
h3 svg{color:var(--accent2)}
.lead{font-style:normal;font-size:14.5px}
.card{border:0;border-radius:20px;box-shadow:var(--shadow);padding:18px 20px}
.btn{font-size:14px;font-weight:600;padding:8px 16px}
.btn.ghost{background:var(--chip);border-color:transparent;color:var(--ink)}
.stat{font-weight:800;letter-spacing:-.02em;font-size:28px}
.petname{font-weight:800;letter-spacing:-.02em}
.modal{border:0;border-radius:22px}
.modal h4{font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.fld label{font-size:13px;font-weight:600}
input,select,textarea{border-radius:12px;background:var(--chip);border-color:transparent}
.check{border-radius:7px}
.bar{height:10px}
.cd{border-radius:12px}
.cal-h span{text-transform:none;letter-spacing:0;font-size:12px}
ul.items li{border-top-color:color-mix(in srgb,var(--line) 70%,transparent)}

/* menu lateral */
nav.tabs{position:fixed;top:0;bottom:0;left:0;width:248px;z-index:15;flex-direction:column;gap:4px;overflow-y:auto;overflow-x:hidden;margin:0;
  padding:calc(24px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:var(--surface);box-shadow:var(--shadow)}
nav.tabs::before{content:"Casa da Carol";font-family:var(--f-title);font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--accent);padding:0 12px 18px}
nav.tabs a{width:100%;background:transparent;box-shadow:none;padding:10px 12px;border-radius:12px;font-size:14.5px;color:var(--soft)}
nav.tabs a:hover{background:var(--chip);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--onaccent)}
nav.tabs a svg{width:20px;height:20px}
.menu-btn{display:none}
@media (min-width:861px){.wrap{max-width:none;margin:0;padding-left:calc(248px + max(32px,env(safe-area-inset-left,0px)));padding-right:max(32px,env(safe-area-inset-right,0px))}.wrap>header,.wrap>main{max-width:1080px}}
@media (max-width:860px){
  nav.tabs{transform:translateX(-105%);transition:transform .25s ease}
  body.menu-open nav.tabs{transform:none}
  .menu-btn{display:grid;gap:4px;place-content:center;width:42px;height:42px;border:0;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);flex:none;align-self:center}
  .menu-btn span{display:block;width:18px;height:2px;border-radius:2px;background:var(--ink)}
  header.top{flex-wrap:nowrap;align-items:center}
  .scrim{position:fixed;inset:0;z-index:14;background:color-mix(in srgb,#000 35%,transparent)}
}
@media (prefers-reduced-motion:reduce){nav.tabs{transition:none}}
.ponto{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pt{display:grid;gap:4px}.pt .btn{justify-self:start}
table.jt{border-collapse:collapse;width:100%;font-size:14px}
table.jt th{text-align:left;font-weight:600;color:var(--soft);font-size:12.5px;padding:6px 8px;white-space:nowrap}
table.jt td{padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap}
.hgrid table.jt th,.hgrid table.jt td{text-align:left}
.hgrid table.jt td button{width:auto;height:auto;border:0;padding:2px 6px}
/* modal */
.ov{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);z-index:20;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:460px;width:100%;max-height:90vh;overflow:auto;padding:20px;border:1px solid var(--line)}
.modal h4{font-family:var(--f-title);font-weight:500;font-size:22px;margin:0 0 12px;color:var(--accent)}
.fld{display:grid;gap:3px;margin-bottom:10px}
.fld label{font-family:var(--f-sub);font-weight:600;font-size:15px;color:var(--soft)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.quick{display:flex;gap:8px;margin-top:10px}
.quick input{flex:1}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.status{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:30}
.chart>svg{width:100%;height:auto;display:block}
.pets{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.petname{font-family:var(--f-title);font-size:26px;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>

</head>
<body>
<div class="login" id="login" hidden><form class="modal" id="lf"><h4>Casa da Carol</h4><p class="muted" style="margin-top:-6px">Entre com seu e-mail e senha.</p><div class="fld"><label for="l-e">E-mail</label><input id="l-e" type="email" autocomplete="username" required></div><div class="fld"><label for="l-s">Senha</label><input id="l-s" type="password" autocomplete="current-password" required></div><p class="muted" id="l-msg" role="alert"></p><button class="btn">Entrar</button></form></div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <button class="menu-btn" id="menu-btn" aria-label="Abrir menu" aria-controls="tabs" aria-expanded="false"><span></span><span></span><span></span></button>
    <div class="grow"><h1 id="hello">Bom dia, Carol</h1><div class="date" id="today"></div></div>
    <div class="row"><div class="sig">Casa da Carol</div><button class="icon-btn" id="sair">sair</button></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Seções"></nav>
  <div class="scrim" id="scrim" hidden></div>
  <main id="view"><p class="empty">Carregando seus dados…</p></main>
</div>
<div id="modal-root"></div>
<div id="status" class="status" hidden></div>

const ic=(n,c='')=>`<span class="ico ${c}" aria-hidden="true">${ICONS[n]||ICONS.notas}</span>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=String(s).split('-').map(Number);return new Date(a,b-1,c||1)};
const TODAY=()=>iso(new Date());
const daysTo=s=>Math.round((parse(s)-parse(TODAY()))/864e5);
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIA=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const fmtDate=s=>{if(!s)return'';const d=parse(s);return`${d.getDate()} de ${MES[d.getMonth()]}`};
const fmtShort=s=>{if(!s)return'';const d=parse(s);return`${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const numBR=x=>{let t=String(x??'').replace(/R\$|\s/g,'');if(t==='')return null;if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');const n=Number(t);return isNaN(n)?null:n};
const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const when=s=>{const n=daysTo(s);if(n===0)return['hoje','warn'];if(n===1)return['amanhã','warn'];if(n<0)return[`atrasado ${-n} d`,'bad'];if(n<=7)return[`em ${n} dias`,'warn'];return[fmtShort(s),''];};
const pillWhen=s=>{if(!s)return'';const[t,c]=when(s);return`<span class="pill ${c}">${esc(t)}</span>`};

function flash(t){const el=$('#status');el.textContent=t;el.hidden=false;clearTimeout(flash.t);flash.t=setTimeout(()=>el.hidden=true,2200)}
async function save(col,id,data){if(!db){flash('Os dados ainda não carregaram. Tente de novo em instantes.');return}
  try{ if(id) await db.collection(col).doc(id).set(data); else await db.collection(col).add(data);}catch(e){flash('Não consegui salvar: '+(e.message||e.code||'erro'))}}
async function patch(col,id,data){try{await db.collection(col).doc(id).update(data)}catch(e){flash('Não consegui salvar: '+(e.message||e.code||'erro'))}}
async function remove(col,id){try{await db.collection(col).doc(id).delete();flash('Apagado')}catch(e){flash('Não consegui apagar: '+(e.message||e.code||'erro'))}}

function openForm(col,doc,preset={}){
  const F=FORMS[col];const v=Object.assign({},preset,doc||{});
  if(col==='cartoes'&&doc)v.faturaMes=(doc.faturas||{})[TODAY().slice(0,7)]?.valor??'';
  if(col==='metas'&&doc)v.marcosTxt=(doc.marcos||[]).map(m=>m.t).join('\n');
  const fields=F.f.map(f=>{
    const val=v[f.k]??(f.def?f.def():'');const id='f-'+f.k;
    let input;
    if(f.type==='select')input=`<select id="${id}">${(typeof f.o==='function'?f.o():f.o).map(o=>`<option ${o==val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(f.type==='textarea')input=`<textarea id="${id}" rows="3">${esc(val)}</textarea>`;
    else if(f.type==='number')input=`<input id="${id}" type="text" inputmode="${f.ph?'numeric':'decimal'}" placeholder="${esc(f.ph||'ex.: 2.500,00')}" value="${esc(val===''||val==null?'':Number(val).toLocaleString('pt-BR',{maximumFractionDigits:2}))}" ${f.req?'required':''}>`;
    else input=`<input id="${id}" type="${f.type||'text'}" value="${esc(val)}" ${f.req?'required':''}>`;
    return`<div class="fld" ${f.only?`data-only="${f.only}"`:''}><label for="${id}">${esc(f.l)}</label>${input}</div>`}).join('');
  $('#modal-root').innerHTML=`<div class="ov" id="ov"><form class="modal" id="mf"><h4>${doc?'Editar':'Novo'}: ${esc(F.t)}</h4>${fields}
   <div class="spread"><div>${doc?`<button type="button" class="icon-btn danger" id="mdel">Apagar</button>`:''}</div>
   <div class="row"><button type="button" class="btn ghost" id="mcancel">Cancelar</button><button class="btn">Salvar</button></div></div></form></div>`;
  const sync=()=>{const t=$('#f-tipo');document.querySelectorAll('[data-only]').forEach(el=>el.hidden=!t||t.value!==el.dataset.only)};
  $('#f-tipo')?.addEventListener('change',sync);sync();
  const close=()=>$('#modal-root').innerHTML='';
  $('#mcancel').onclick=close;$('#ov').onclick=e=>{if(e.target.id==='ov')close()};
  if(doc)$('#mdel').onclick=e=>{const b=e.target;if(b.dataset.sure){remove(col,doc.id);close()}else{b.dataset.sure=1;b.textContent='Toque de novo para apagar'}};
  $('#mf').onsubmit=async e=>{e.preventDefault();const out={};
    F.f.forEach(f=>{let x=$('#f-'+f.k).value;if(f.type==='number')x=numBR(x);out[f.k]=x});
    if(col==='metas'){const old=(doc&&doc.marcos)||[];out.marcos=out.marcosTxt.split('\n').map(s=>s.trim()).filter(Boolean).map(t=>({t,feito:!!(old.find(m=>m.t===t)||{}).feito}));delete out.marcosTxt}
    if(col==='casa'||col==='compromissos')out.feito=doc?.feito||false;
    if(col==='feira')out.comprado=doc?.comprado||false;
    if(col==='parcelas'){out.n=Math.max(1,Math.round(out.n||1))}
    if(col==='cartoes'){out.faturas={...(doc?.faturas||{})};const fm=TODAY().slice(0,7);if(out.faturaMes!=null)out.faturas[fm]={...(out.faturas[fm]||{}),valor:out.faturaMes};delete out.faturaMes;out.dia=Math.min(31,Math.max(1,Math.round(out.dia||1)))}
    if(col==='fixas'){out.pagos=doc?.pagos||{};out.dia=Math.min(31,Math.max(1,Math.round(out.dia||1)))}
    if(col==='contas')out.pago=doc?.pago||false;
    if(col==='habitos')out.ordem=doc?.ordem??S.habitos.length;
    if(!doc)out.criadoEm=Date.now();
    const {id,...rest}=doc||{};close();await save(col,doc?doc.id:null,doc?Object.assign({},rest,out):out);flash('Salvo')};
  $('#mf input,#mf select')?.focus();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const{act,col,id,extra}=b.dataset;
  const doc=id?S[col]?.find(d=>d.id===id):null;
  if(act==='new')openForm(col,null,extra?JSON.parse(extra):{});
  if(act==='edit'&&doc)openForm(col,doc);
  if(act==='toggle'&&doc){const k=col==='contas'?'pago':col==='feira'?'comprado':'feito';patch(col,id,{[k]:!doc[k]});
    if(col==='contas'&&!doc.pago&&doc.mensal==='sim'){const d=parse(doc.vencimento);d.setMonth(d.getMonth()+1);const{id:_,...r}=doc;save('contas',null,{...r,vencimento:iso(d),pago:false,criadoEm:Date.now()})}}
  if(act==='habit')toggleHabit(id,extra||TODAY());
  if(act==='marco'&&doc){const m=doc.marcos.map((x,i)=>i==extra?{...x,feito:!x.feito}:x);patch('metas',id,{marcos:m})}
  if(act==='month'){finMonth=extra;render()}
  if(act==='calmonth'){calMonth=extra;calDay=extra===TODAY().slice(0,7)?TODAY():extra+'-01';render()}
  if(act==='calday'){calDay=extra;render()}
  if(act==='budget')editBudget();
  if(act==='semestre')editSemestre();
  if(act==='feira-reset'){const b=e.target.closest('button');if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Toque de novo para desmarcar tudo';return}S.feira.filter(x=>x.comprado).forEach(x=>patch('feira',x.id,{comprado:false}));flash('Lista pronta para o próximo mês')}
  if(act==='feira-lancar'){const t=S.feira.filter(x=>x.comprado).reduce((a,x)=>a+(+x.preco||0),0);openForm('lancamentos',null,{tipo:'despesa',descricao:'Feira do mês',valor:t||'',categoria:'Alimentação'})}
  if(act==='fixa'&&doc){payFixa(doc,extra)}
  if(act==='fatura'&&doc){editFatura(doc,extra)}
  if(act==='fatpaga'&&doc){payFatura(doc,extra)}
  if(act==='ponto'){marcaPonto(id,extra)}
  if(act==='pontoedit'){editPonto(extra)}
  if(act==='dormiu'){const d=S.ponto.find(x=>x.id===extra)||{};const{id:_,...r}=d;save('ponto',extra,{...r,dormiu:!d.dormiu})}
  if(act==='fmonth'){funcMonth=extra;render()}
  if(act==='funcaj'){editFuncCfg()}
  if(act==='sil-lancar'){const vs=S.visitas.filter(v=>(v.data||'').startsWith(funcMonth));const t=vs.reduce((a,v)=>a+(+v.valor||0),0);const[y,m]=funcMonth.split('-');openForm('lancamentos',null,{tipo:'despesa',descricao:`Silvanei · ${MES[+m-1]} (${vs.length} idas)`,valor:t||'',categoria:'Funcionárias'})}
  if(act==='done-clear'){S.casa.filter(x=>x.feito&&x.lista===extra).forEach(x=>remove('casa',x.id))}
});
function toggleHabit(hid,day){const m=S.marcas.find(x=>x.id===day);const f=new Set((m&&m.feitos)||[]);f.has(hid)?f.delete(hid):f.add(hid);save('marcas',day,{feitos:[...f]})}
const addBtn=(col,label='Adicionar',extra)=>`<button class="btn ghost" data-act="new" data-col="${col}" ${extra?`data-extra='${esc(JSON.stringify(extra))}'`:''}>+ ${esc(label)}</button>`;
const editBtn=(col,id)=>`<button class="icon-btn" data-act="edit" data-col="${col}" data-id="${id}" aria-label="Editar">editar</button>`;

const TABS=[['hoje','Hoje','notas'],['habitos','Hábitos','autocuidado'],['agenda','Agenda','agenda'],['metas','Metas','metas'],['financas','Finanças','financas'],['feira','Feira do mês','compras'],['casa','Casa','casa'],['funcionarias','Funcionárias','trabalho'],['marina','Marina','familia'],['cachorras','Kiara e Diana','saude']];
const route=()=>{const h=location.hash.slice(1);return TABS.some(t=>t[0]===h)?h:'hoje'};
function renderTabs(){const r=route();$('#tabs').innerHTML=TABS.map(([k,l,i])=>`<a href="#${k}" ${k===r?'aria-current="page"':''}>${ICONS[i]}${l}</a>`).join('')}

function habitsToday(day=TODAY()){const m=S.marcas.find(x=>x.id===day);const f=new Set((m&&m.feitos)||[]);
  const hs=[...S.habitos].sort((a,b)=>(a.ordem??0)-(b.ordem??0));
  if(!hs.length)return`<p class="empty">Nenhum hábito ainda.</p>${addBtn('habitos','Novo hábito')}`;
  return`<ul class="items">${hs.map(h=>`<li><button class="check ${f.has(h.id)?'on':''}" data-act="habit" data-id="${h.id}" aria-label="Marcar ${esc(h.nome)}"></button>${ic(h.icone)}<span class="grow ${f.has(h.id)?'done':''}">${esc(h.nome)}</span><span class="pill">${streak(h.id)} d seguidos</span></li>`).join('')}</ul>`}
function streak(hid){let n=0;const d=new Date();const has=x=>(S.marcas.find(m=>m.id===iso(x))?.feitos||[]).includes(hid);if(!has(d))d.setDate(d.getDate()-1);while(has(d)){n++;d.setDate(d.getDate()-1)}return n}

function agendaList(items,showDate=true){if(!items.length)return'<p class="empty">Nada marcado.</p>';
  return`<ul class="items">${items.map(c=>`<li>${ic(c.icone||'agenda')}<div class="grow"><div>${c.hora?`<b class="num">${esc(c.hora)}</b> · `:''}${esc(c.titulo)}</div>${c.nota?`<div class="muted">${esc(c.nota)}</div>`:''}</div>${showDate?pillWhen(c.data):''}${editBtn('compromissos',c.id)}</li>`).join('')}</ul>`}
const sortAg=(a,b)=>(a.data+(a.hora||'99')).localeCompare(b.data+(b.hora||'99'));

function proximos(dias=15){const out=[];
  S.marina.forEach(r=>{if(r.proxima&&daysTo(r.proxima)<=dias)out.push({q:'Marina',t:r.titulo,d:r.proxima,col:'marina',id:r.id,i:'familia'})});
  S.pets.forEach(r=>{if(r.proxima&&daysTo(r.proxima)<=dias)out.push({q:r.pet,t:`${r.tipo}: ${r.titulo}`,d:r.proxima,col:'pets',id:r.id,i:'saude'})});
  S.contas.forEach(r=>{if(!r.pago&&r.vencimento&&daysTo(r.vencimento)<=7)out.push({q:'Conta',t:`${r.descricao}${r.valor?' · '+brl(r.valor):''}`,d:r.vencimento,col:'contas',id:r.id,i:'financas',pay:1})});
  const mes=TODAY().slice(0,7);S.fixas.forEach(f=>{if(!f.pagos?.[mes]){const v=fixaVenc(f,mes);if(daysTo(v)<=7)out.push({q:'Conta fixa',t:`${f.nome} · ${brl(f.valor)}`,d:v,col:'fixas',id:f.id,i:'financas',fixa:mes})}});
  S.cartoes.forEach(c=>{const f=(c.faturas||{})[mes]||{};if(!f.pago){const v=fixaVenc(c,mes);if(daysTo(v)<=7)out.push({q:'Cartão',t:`Fatura ${c.nome}${f.valor?' · '+brl(f.valor):''}`,d:v,col:'cartoes',id:c.id,i:'financas',cart:mes})}});
  return out.sort((a,b)=>a.d.localeCompare(b.d))}
function lembretes(list){if(!list.length)return'<p class="empty">Nenhum lembrete para os próximos dias.</p>';
  return`<ul class="items">${list.map(x=>`<li>${x.cart?`<button class="check" data-act="fatpaga" data-col="cartoes" data-id="${x.id}" data-extra="${x.cart}" aria-label="Marcar fatura como paga"></button>`:x.fixa?`<button class="check" data-act="fixa" data-col="fixas" data-id="${x.id}" data-extra="${x.fixa}" aria-label="Marcar como paga"></button>`:x.pay?`<button class="check" data-act="toggle" data-col="contas" data-id="${x.id}" aria-label="Marcar como paga"></button>`:ic(x.i)}<div class="grow"><span class="muted">${esc(x.q)}</span><div>${esc(x.t)}</div></div>${pillWhen(x.d)}</li>`).join('')}</ul>`}

function semestre(){const c=cfg('geral');const y=new Date().getFullYear();const m=new Date().getMonth();
  return{ini:c.inicio||(m<6?`${y}-01-01`:`${y}-07-01`),fim:c.fim||(m<6?`${y}-06-30`:`${y}-12-31`)}}
function metaProg(g){const ms=g.marcos||[];return ms.length?ms.filter(m=>m.feito).length/ms.length:0}
function semFrac(){const{ini,fim}=semestre();const t=(parse(TODAY())-parse(ini))/(parse(fim)-parse(ini));return Math.max(0,Math.min(1,t))}
function ritmo(p){const s=semFrac();if(p>=s-0.05)return['no ritmo','ok'];if(p>=s-0.2)return['um pouco atrás','warn'];return['precisa de atenção','bad']}

function V_hoje(){const t=TODAY();const ag=S.compromissos.filter(c=>c.data===t).sort(sortAg);
  const amanha=S.compromissos.filter(c=>daysTo(c.data)===1).sort(sortAg);

  const casa=['comprar','ajeitar','instalar'].map(l=>[l,S.casa.filter(x=>x.lista===l&&!x.feito).length]);casa.unshift(['a feira',S.feira.filter(x=>!x.comprado).length]);
  const mes=t.slice(0,7);const fin=finSum(mes);
  return`<p class="lead">Seu resumo do dia. Ele se atualiza sozinho sempre que você abre esta página.</p>
  <div class="grid">
   <section class="card"><h3>${ICONS.agenda} Agenda de hoje</h3>${agendaList(ag,false)}${amanha.length?`<p class="muted" style="margin:10px 0 0">Amanhã: ${amanha.map(c=>esc((c.hora?c.hora+' ':'')+c.titulo)).join(' · ')}</p>`:''}<div class="quick">${addBtn('compromissos','Compromisso')}</div></section>
   <section class="card"><h3>${ICONS.autocuidado} Hábitos de hoje</h3>${habitsToday()}</section>
   <section class="card"><h3>${ICONS.tarefas} Lembretes</h3>${lembretes(proximos())}</section>
   <section class="card"><h3>${ICONS.metas} Meta em destaque</h3>${g?metaCard(g,true):'<p class="empty">Cadastre suas metas do semestre na aba Metas.</p>'}</section>
   <section class="card"><h3>${ICONS.financas} Dinheiro no mês</h3><div class="stats"><div><div class="muted">Gasto até agora</div><div class="stat num">${brl(fin.desp)}</div></div><div><div class="muted">Sobra</div><div class="stat num">${brl(fin.rec-fin.desp)}</div></div></div></section>
   <section class="card"><h3>${ICONS.casa} Casa</h3><ul class="items">${casa.map(([l,n])=>`<li><span class="grow">${l==='a feira'?'Falta na feira':'Para '+l}</span><span class="pill">${n} ${n===1?'item':'itens'}</span></li>`).join('')}</ul></section>
  </div>`}

function V_habitos(){const now=new Date();const y=now.getFullYear(),m=now.getMonth();const nd=new Date(y,m+1,0).getDate();
  const hs=[...S.habitos].sort((a,b)=>(a.ordem??0)-(b.ordem??0));const days=[...Array(nd)].map((_,i)=>`${y}-${pad(m+1)}-${pad(i+1)}`);
  const feitos=d=>S.marcas.find(x=>x.id===d)?.feitos||[];
  const passados=days.filter(d=>d<=TODAY());const total=passados.length*hs.length;
  const ok=passados.reduce((s,d)=>s+feitos(d).filter(h=>hs.some(x=>x.id===h)).length,0);
  const cheios=passados.filter(d=>hs.length&&hs.every(h=>feitos(d).includes(h.id))).length;
  return`<h2>Hábitos</h2><p class="lead">Marque o que fez hoje. Na grade do mês você também pode marcar dias que passaram.</p>
  <div class="grid"><section class="card"><div class="spread"><h3>${ICONS.autocuidado} Hoje</h3>${addBtn('habitos','Novo hábito')}</div>${habitsToday()}
  ${hs.length?`<p class="muted" style="margin-top:10px">Para renomear ou apagar: ${hs.map(h=>`<button class="icon-btn" data-act="edit" data-col="habitos" data-id="${h.id}">${esc(h.nome)}</button>`).join('')}</p>`:''}</section>
  <section class="card"><h3>${ICONS.metas} ${MES[m]}</h3><div class="stats"><div><div class="muted">Cumprido</div><div class="stat num">${total?Math.round(ok/total*100):0}%</div></div><div><div class="muted">Dias com tudo feito</div><div class="stat num">${cheios}</div></div></div></section></div>
  ${hs.length?`<section class="card" style="margin-top:14px"><h3>${ICONS.agenda} Grade do mês</h3><div class="hgrid"><table><tr><th></th>${days.map(d=>`<th class="num">${+d.slice(8)}</th>`).join('')}</tr>
  ${hs.map(h=>`<tr><th class="n">${esc(h.nome)}</th>${days.map(d=>`<td class="${d===TODAY()?'today':''}">${d<=TODAY()?`<button class="${feitos(d).includes(h.id)?'on':''}" data-act="habit" data-id="${h.id}" data-extra="${d}" aria-label="${esc(h.nome)} dia ${+d.slice(8)}"></button>`:''}</td>`).join('')}</tr>`).join('')}</table></div></section>`:''}`}

let calMonth=TODAY().slice(0,7),calDay=TODAY();
function eventosDoDia(d){const ev=S.compromissos.filter(c=>c.data===d).sort(sortAg).map(c=>({k:'ag',t:(c.hora?c.hora+' ':'')+c.titulo}));
  S.contas.filter(c=>!c.pago&&c.vencimento===d).forEach(c=>ev.push({k:'conta',t:'Conta: '+c.descricao}));
  S.fixas.filter(f=>fixaVenc(f,d.slice(0,7))===d&&!f.pagos?.[d.slice(0,7)]).forEach(f=>ev.push({k:'conta',t:'Conta: '+f.nome}));
  S.cartoes.filter(c=>fixaVenc(c,d.slice(0,7))===d&&!((c.faturas||{})[d.slice(0,7)]||{}).pago).forEach(c=>ev.push({k:'conta',t:'Fatura: '+c.nome}));
  S.marina.filter(r=>r.proxima===d).forEach(r=>ev.push({k:'cuid',t:'Marina: '+r.titulo}));
  S.pets.filter(r=>r.proxima===d).forEach(r=>ev.push({k:'cuid',t:r.pet+': '+r.titulo}));return ev}
function V_agenda(){const[y,m]=calMonth.split('-').map(Number);const first=new Date(y,m-1,1);const nd=new Date(y,m,0).getDate();const lead=first.getDay();
  const cells=[...Array(lead)].map(()=>'<div class="cd out"></div>').join('')+[...Array(nd)].map((_,i)=>{const d=`${calMonth}-${pad(i+1)}`;const ev=eventosDoDia(d);
    return`<button class="cd ${d===TODAY()?'hoje':''} ${d===calDay?'sel':''}" data-act="calday" data-extra="${d}" aria-label="${i+1} de ${MES[m-1]}, ${ev.length} itens"><span class="dn num">${i+1}</span>${ev.slice(0,3).map(e=>`<span class="ev ${e.k}">${esc(e.t)}</span>`).join('')}${ev.length>3?`<span class="more">+${ev.length-3}</span>`:''}</button>`}).join('');
  const dia=S.compromissos.filter(c=>c.data===calDay).sort(sortAg);const extras=eventosDoDia(calDay).filter(e=>e.k!=='ag');
  return`<h2>Agenda</h2><div class="spread"><p class="lead" style="margin:0">${MES[m-1]} de ${y}</p><div class="row"><button class="btn ghost" data-act="calmonth" data-extra="${shiftMonth(calMonth,-1)}" aria-label="Mês anterior">‹</button><button class="btn ghost" data-act="calmonth" data-extra="${TODAY().slice(0,7)}">Hoje</button><button class="btn ghost" data-act="calmonth" data-extra="${shiftMonth(calMonth,1)}" aria-label="Próximo mês">›</button></div></div>
  <section class="card cal" style="margin-top:12px"><div class="cal-h">${['dom','seg','ter','qua','qui','sex','sáb'].map(d=>`<span>${d}</span>`).join('')}</div><div class="cal-g">${cells}</div>
   <div class="row muted" style="margin-top:10px;font-size:13px"><span class="ev ag" style="display:inline">compromisso</span><span class="ev conta" style="display:inline">conta</span><span class="ev cuid" style="display:inline">cuidado</span></div></section>
  <section class="card" style="margin-top:14px"><div class="spread"><h3>${ICONS.agenda} ${DIA[parse(calDay).getDay()]}, ${fmtDate(calDay)}</h3>${addBtn('compromissos','Compromisso',{data:calDay})}</div>${agendaList(dia,false)}
   ${extras.length?`<ul class="items">${extras.map(e=>`<li><span class="ev ${e.k}" style="display:inline">${esc(e.t)}</span></li>`).join('')}</ul>`:''}</section>`}
function metaCard(g,compact){const p=metaProg(g);const[r,c]=ritmo(p);const ms=g.marcos||[];
  return`<div class="row" style="align-items:flex-start">${ic(g.area||'metas')}<div class="grow"><div class="spread"><b style="font-family:var(--f-title);font-weight:500;font-size:18px">${esc(g.titulo)}</b>${editBtn('metas',g.id)}</div>
  ${g.porque&&!compact?`<div class="muted">${esc(g.porque)}</div>`:''}
  <div class="spread" style="margin:8px 0 4px"><span class="num muted">${ms.filter(m=>m.feito).length} de ${ms.length} etapas</span><span class="pill ${c}">${r}</span></div>
  <div class="bar"><i style="width:${p*100}%"></i><b style="left:${semFrac()*100}%" title="quanto do semestre já passou"></b></div>
  ${ms.length?`<ul class="items" style="margin-top:8px">${ms.map((m,i)=>`<li><button class="check ${m.feito?'on':''}" data-act="marco" data-id="${g.id}" data-extra="${i}" aria-label="${esc(m.t)}"></button><span class="${m.feito?'done':''}">${esc(m.t)}</span></li>`).join('')}</ul>`:'<p class="empty">Toque em editar para colocar as etapas.</p>'}</div></div>`}
function V_metas(){const{ini,fim}=semestre();
  return`<h2>Metas do semestre</h2><p class="lead">De ${fmtDate(ini)} a ${fmtDate(fim)}. Já passou ${Math.round(semFrac()*100)}% do semestre, que é a marca fina em cada barra.</p>
  <div class="row" style="margin-bottom:12px">${addBtn('metas','Nova meta')}<button class="btn ghost" data-act="semestre">Mudar datas do semestre</button></div>
  ${S.metas.length?`<div class="grid">${S.metas.map(g=>`<section class="card">${metaCard(g)}</section>`).join('')}</div>`:'<p class="empty">Nenhuma meta ainda. Comece pela que mais importa para você neste semestre.</p>'}`}
function editSemestre(){const{ini,fim}=semestre();$('#modal-root').innerHTML=`<div class="ov"><form class="modal" id="sf"><h4>Datas do semestre</h4><div class="fld"><label for="s-i">Começa</label><input type="date" id="s-i" value="${ini}"></div><div class="fld"><label for="s-f">Termina</label><input type="date" id="s-f" value="${fim}"></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" onclick="document.getElementById('modal-root').innerHTML=''">Cancelar</button><button class="btn">Salvar</button></div></form></div>`;
  $('#sf').onsubmit=e=>{e.preventDefault();const{id:_i,...c0}=cfg('geral');save('config','geral',{...c0,inicio:$('#s-i').value,fim:$('#s-f').value});$('#modal-root').innerHTML=''}}

/* finanças */
let finMonth=TODAY().slice(0,7);
function finSum(mes){const l=S.lancamentos.filter(x=>(x.data||'').startsWith(mes));const rec=l.filter(x=>x.tipo==='receita').reduce((s,x)=>s+(+x.valor||0),0);const desp=l.filter(x=>x.tipo!=='receita').reduce((s,x)=>s+(+x.valor||0),0);return{l,rec,desp}}
const shiftMonth=(m,n)=>{const d=parse(m+'-01');d.setMonth(d.getMonth()+n);return iso(d).slice(0,7)};
function chart6(){const ms=[...Array(6)].map((_,i)=>shiftMonth(finMonth,i-5));const data=ms.map(m=>({m,...finSum(m)}));const max=Math.max(1,...data.flatMap(d=>[d.rec,d.desp]));
  const W=600,H=200,L=10,B=30,T=14,bw=(W-L*2)/6;const y=v=>T+(H-T-B)*(1-v/max);
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e despesas dos últimos 6 meses">
   <line x1="${L}" x2="${W-L}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>
   ${data.map((d,i)=>{const x=L+i*bw+bw*.18,w=bw*.3;return`<rect x="${x}" y="${y(d.rec)}" width="${w}" height="${H-B-y(d.rec)}" fill="var(--warm)" rx="3"><title>Receitas ${brl(d.rec)}</title></rect><rect x="${x+w+3}" y="${y(d.desp)}" width="${w}" height="${H-B-y(d.desp)}" fill="var(--accent)" rx="3"><title>Despesas ${brl(d.desp)}</title></rect><text x="${L+i*bw+bw/2}" y="${H-10}" text-anchor="middle" font-size="13" fill="var(--soft)" font-family="Plus Jakarta Sans,sans-serif">${MES[+d.m.slice(5)-1].slice(0,3)}</text>`}).join('')}
  </svg><div class="row muted"><span><span class="pill" style="background:var(--warm);color:var(--onaccent)">receitas</span></span><span><span class="pill" style="background:var(--accent);color:var(--onaccent)">despesas</span></span></div>`}

const fixaVenc=(f,mes)=>{const[y,m]=mes.split('-').map(Number);const nd=new Date(y,m,0).getDate();return`${mes}-${pad(Math.min(+f.dia||1,nd))}`};
async function payFixa(f,mes){const pagos={...(f.pagos||{})};
  if(pagos[mes]){const lid=pagos[mes];delete pagos[mes];await patch('fixas',f.id,{pagos});if(typeof lid==='string'&&S.lancamentos.some(l=>l.id===lid))remove('lancamentos',lid);return}
  const lid=uid2();pagos[mes]=lid;await patch('fixas',f.id,{pagos});
  const hoje=TODAY();await save('lancamentos',lid,{tipo:'despesa',descricao:f.nome,valor:+f.valor||0,categoria:f.categoria||'Casa',data:hoje.startsWith(mes)?hoje:fixaVenc(f,mes),fixa:f.id,criadoEm:Date.now()});flash('Pago e lançado nas despesas')}
const uid2=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));

async function payFatura(c,mes){const fat={...(c.faturas||{})};const f={...(fat[mes]||{})};
  if(f.pago){f.pago=false;const lid=f.lanc;delete f.lanc;fat[mes]=f;await patch('cartoes',c.id,{faturas:fat});if(lid&&S.lancamentos.some(l=>l.id===lid))remove('lancamentos',lid);return}
  if(!f.valor){editFatura(c,mes,true);return}
  const lid=uid2();f.pago=true;f.lanc=lid;fat[mes]=f;await patch('cartoes',c.id,{faturas:fat});
  const hoje=TODAY();await save('lancamentos',lid,{tipo:'despesa',descricao:'Fatura '+c.nome,valor:+f.valor,categoria:'Cartão de crédito',data:hoje.startsWith(mes)?hoje:fixaVenc(c,mes),cartao:c.id,criadoEm:Date.now()});flash('Fatura paga e lançada nas despesas')}
function editFatura(c,mes,thenPay){const f=(c.faturas||{})[mes]||{};const[y,m]=mes.split('-');
  $('#modal-root').innerHTML=`<div class="ov"><form class="modal" id="ff"><h4>Fatura ${esc(c.nome)}</h4><p class="muted" style="margin-top:-6px">${MES[+m-1]} de ${y} · vence dia ${+c.dia}</p><div class="fld"><label for="fv">Valor da fatura (R$)</label><input id="fv" type="text" inputmode="decimal" placeholder="ex.: 1.850,00" value="${f.valor!=null?Number(f.valor).toLocaleString('pt-BR',{maximumFractionDigits:2}):''}" required></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" onclick="document.getElementById('modal-root').innerHTML=''">Cancelar</button><button class="btn">Salvar</button></div></form></div>`;
  $('#fv').focus();$('#ff').onsubmit=async e=>{e.preventDefault();const v=numBR($('#fv').value);if(v==null)return;const fat={...(c.faturas||{})};fat[mes]={...(fat[mes]||{}),valor:v};$('#modal-root').innerHTML='';await patch('cartoes',c.id,{faturas:fat});flash('Fatura salva');
    if(thenPay){const nc=S.cartoes.find(x=>x.id===c.id)||{...c,faturas:fat};payFatura(nc,mes)}}}
function cartoesCard(mes){const cs=[...S.cartoes].sort((a,b)=>(+a.dia||0)-(+b.dia||0));const fat=c=>(c.faturas||{})[mes]||{};
  const tot=cs.reduce((a,c)=>a+(+fat(c).valor||0),0);const aberto=cs.filter(c=>!fat(c).pago).reduce((a,c)=>a+(+fat(c).valor||0),0);
  return`<section class="card"><div class="spread"><h3>${ICONS.financas} Cartões de crédito</h3>${addBtn('cartoes','Cartão')}</div>
  ${cs.length?`<div class="stats" style="margin-bottom:6px"><div><div class="muted">Faturas do mês</div><div class="stat num">${brl(tot)}</div></div><div><div class="muted">Falta pagar</div><div class="stat num">${brl(aberto)}</div></div></div>
  <ul class="items">${cs.map(c=>{const f=fat(c);const v=fixaVenc(c,mes);const uso=c.limite&&f.valor?Math.round(f.valor/c.limite*100):null;

   <section class="card"><div class="spread"><h3>${ICONS.familia} Sil · idas no mês</h3>${addBtn('visitas','Registrar ida',{data:hoje})}</div>
    <div class="stats"><div><div class="muted">Idas</div><div class="stat num">${vs.length}</div></div><div><div class="muted">Gasto no mês</div><div class="stat num">${brl(totSil)}</div></div></div>
    ${vs.length?`<ul class="items" style="margin-top:8px">${vs.map(v=>`<li><div class="grow">${DIA[parse(v.data).getDay()]}, ${fmtShort(v.data)} <span class="muted">· ${esc(v.tipo||'')}</span>${v.nota?`<div class="muted">${esc(v.nota)}</div>`:''}</div><span class="num">${brl(v.valor)}</span>${editBtn('visitas',v.id)}</li>`).join('')}</ul>
    <div class="row" style="margin-top:10px"><button class="btn ghost" data-act="sil-lancar">Lançar o total em Finanças</button></div>`:`<p class="empty">Nenhuma ida registrada neste mês.${cfg('funcionarias').valorSil==null?' Defina o valor padrão por ida em Ajustes para não precisar digitar toda vez.':''}</p>`}</section>
  </div>
  <section class="card" style="margin-top:14px"><h3>${ICONS.agenda} Beta · jornada do mês</h3>${dias.length?`<div class="hgrid"><table class="jt"><tr><th>Dia</th>${PONTO.map(([,l])=>`<th>${l}</th>`).join('')}<th>Horas</th><th>Dormiu</th><th></th></tr>
   ${[...dias].reverse().map(d=>{const r=reg(d)||{};const mi=minutos(r);return`<tr><td class="n">${DIA[parse(d).getDay()].slice(0,3)} ${fmtShort(d)}</td>${PONTO.map(([k])=>`<td class="num">${r[k]||'–'}</td>`).join('')}<td class="num"><b>${mi!=null?fmtH(mi):(r.nota?esc(r.nota):'–')}</b></td><td>${r.dormiu?'sim':''}</td><td><button class="icon-btn" data-act="pontoedit" data-extra="${d}">editar</button></td></tr>`}).join('')}</table></div>`:'<p class="empty">Os dias úteis do mês aparecem aqui conforme forem passando.</p>'}</section>`}

function V_casa(){const L=[['comprar','O que comprar','compras'],['ajeitar','O que ajeitar','tarefas'],['instalar','O que instalar','casa']];
  return`<h2>Casa</h2><p class="lead">Três listas para a casa. Marque o que já resolveu.</p><div class="grid">${L.map(([k,t,i])=>{const it=S.casa.filter(x=>x.lista===k).sort((a,b)=>(a.feito-b.feito)||(a.criadoEm-b.criadoEm));const nd=it.filter(x=>x.feito).length;
   return`<section class="card"><div class="spread"><h3>${ICONS[i]} ${t}</h3>${addBtn('casa','Item',{lista:k})}</div>${it.length?`<ul class="items">${it.map(x=>`<li><button class="check ${x.feito?'on':''}" data-act="toggle" data-col="casa" data-id="${x.id}" aria-label="Concluir ${esc(x.texto)}"></button><div class="grow ${x.feito?'done':''}">${esc(x.texto)}${x.onde?`<div class="muted">${esc(x.onde)}</div>`:''}</div>${editBtn('casa',x.id)}</li>`).join('')}</ul>`:'<p class="empty">Lista vazia.</p>'}
   ${nd?`<button class="icon-btn" data-act="done-clear" data-extra="${k}">limpar ${nd} concluído${nd>1?'s':''}</button>`:''}</section>`}).join('')}</div>
   <section class="card" style="margin-top:14px"><h3>${ICONS.trabalho} Rotina da Beta</h3><p style="margin:0">O cronograma da Beta, de segunda a sexta, está na folha impressa da geladeira. Quando quiser mudar alguma tarefa, é só pedir que eu gero uma folha nova.</p></section>`}

function recList(items,col){if(!items.length)return'<p class="empty">Nada registrado.</p>';return`<ul class="items">${items.map(r=>`<li><div class="grow">${esc(r.titulo)}${r.peso||r.altura?` <span class="num muted">${r.peso?r.peso+' kg':''}${r.peso&&r.altura?' · ':''}${r.altura?r.altura+' cm':''}</span>`:''}<div class="muted">${r.data?fmtDate(r.data):''}${r.nota?' · '+esc(r.nota):''}</div></div>${r.proxima?pillWhen(r.proxima):''}${editBtn(col,r.id)}</li>`).join('')}</ul>`}
const byDate=(a,b)=>(b.data||'').localeCompare(a.data||'');
function V_marina(){const T=[['vacina','Vacinas','saude'],['consulta','Consultas','familia'],['medida','Peso e altura','metas'],['marco','Marcos e conquistas','lazer'],['alimento','Introdução alimentar','alimentacao'],['comprar','Comprar para ela','compras']];
  const prox=proximos(60).filter(x=>x.q==='Marina');
  return`<h2>Marina</h2><p class="lead">Tudo da Marina num lugar só. As datas de “próxima” viram lembretes no resumo do dia.</p>
  <section class="card"><h3>${ICONS.agenda} Próximos cuidados</h3>${lembretes(prox)}</section>
  <div class="grid" style="margin-top:14px">${T.map(([k,t,i])=>`<section class="card"><div class="spread"><h3>${ICONS[i]} ${t}</h3>${addBtn('marina','Novo',{tipo:k})}</div>${recList(S.marina.filter(r=>r.tipo===k).sort(byDate),'marina')}</section>`).join('')}</div>`}
function V_cachorras(){const P=[['Kiara','2 anos'],['Diana','7 anos · fase sênior, check-up anual']];
  return`<h2>Kiara e Diana</h2><p class="lead">Uma ficha para cada uma. Cuidados com “próxima data” aparecem nos lembretes.</p><div class="pets">${P.map(([n,s])=>{const rs=S.pets.filter(r=>r.pet===n||r.pet==='as duas').sort(byDate);const prox=proximos(60).filter(x=>x.q===n||x.q==='as duas');
   return`<section class="card"><div class="spread"><div><div class="petname">${n}</div><div class="muted">${s}</div></div>${addBtn('pets','Cuidado',{pet:n})}</div>
   <h3 style="margin-top:14px">Próximos</h3>${lembretes(prox)}<h3 style="margin-top:14px">Histórico</h3>${recList(rs.slice(0,15).map(r=>({...r,titulo:`${r.tipo}: ${r.titulo}${r.pet==='as duas'?' (as duas)':''}`})),'pets')}</section>`}).join('')}</div>`}

const VIEWS={funcionarias:V_funcionarias,feira:V_feira,hoje:V_hoje,habitos:V_habitos,agenda:V_agenda,metas:V_metas,financas:V_financas,casa:V_casa,marina:V_marina,cachorras:V_cachorras};
function render(){renderTabs();const d=new Date();const h=d.getHours();
  $('#hello').textContent=(h<12?'Bom dia':h<18?'Boa tarde':'Boa noite')+', Carol';
  $('#today').textContent=`${DIA[d.getDay()]}, ${d.getDate()} de ${MES[d.getMonth()]} de ${d.getFullYear()}`;
  if(!ready){return}
  const y=scrollY;$('#view').innerHTML=VIEWS[route()]();scrollTo(0,y)}

function setMenu(open){document.body.classList.toggle('menu-open',open);$('#scrim').hidden=!open;$('#menu-btn').setAttribute('aria-expanded',open)}
$('#menu-btn').onclick=()=>setMenu(!document.body.classList.contains('menu-open'));
$('#scrim').onclick=()=>setMenu(false);
addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
addEventListener('hashchange',()=>{scrollTo(0,0);setMenu(false);render()});
render();

/* ---------- Supabase (igual ao Sistema Linéa) ---------- */
const SUPABASE_URL='COLE_AQUI_A_PROJECT_URL';
const SUPABASE_KEY='COLE_AQUI_A_PUBLISHABLE_KEY';
let sb=null;
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
function makeDb(){
  const notify=()=>{if(!$('#modal-root').innerHTML)render()};
  const local=(c,id,data)=>{const k=S[c].findIndex(d=>d.id===id);if(data===null){if(k>=0)S[c].splice(k,1)}else if(k>=0)S[c][k]={id,...data};else S[c].push({id,...data});S[c]=[...S[c]];notify(c)};
  const chk=({error})=>{if(error)throw error};
  const doc=(c,id)=>({
    async set(data){chk(await sb.from('itens').upsert({colecao:c,id,dados:data},{onConflict:'dono,colecao,id'}));local(c,id,data)},
    async update(data){const cur=S[c].find(d=>d.id===id)||{};const{id:_,...r}=cur;const nd={...r,...data};chk(await sb.from('itens').update({dados:nd}).eq('colecao',c).eq('id',id));local(c,id,nd)},
    async delete(){chk(await sb.from('itens').delete().eq('colecao',c).eq('id',id));local(c,id,null)}});
  return{collection:c=>({doc:id=>doc(c,id||uid()),async add(data){const id=uid();await doc(c,id).set(data);return{id}}})};
}
async function loadAll(){const out=[];let from=0;for(;;){const{data,error}=await sb.from('itens').select('colecao,id,dados').range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)break;from+=1000}
  COLS.forEach(c=>S[c]=[]);out.forEach(r=>{if(S[r.colecao])S[r.colecao].push({id:r.id,...r.dados})})}
async function entrar(){
  $('#login').hidden=true;$('#app').hidden=false;$('#view').innerHTML='<p class="empty">Carregando seus dados…</p>';
  try{await loadAll()}catch(e){$('#view').innerHTML=`<p class="empty">Não consegui carregar seus dados: ${esc(e.message)}. Recarregue a página.</p>`;return}
  db=makeDb();ready=true;render();
}
function pedirLogin(msg=''){ready=false;$('#app').hidden=true;$('#login').hidden=false;$('#l-msg').textContent=msg;$('#l-e').focus()}
(async()=>{
  if(!window.supabase||!window.supabase.createClient){document.body.innerHTML='<p style="padding:24px">Não consegui carregar o sistema. Confira a internet e recarregue a página.</p>';return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  $('#lf').onsubmit=async e=>{e.preventDefault();$('#l-msg').textContent='Entrando…';
    const{error}=await sb.auth.signInWithPassword({email:$('#l-e').value.trim(),password:$('#l-s').value});
    if(error){$('#l-msg').textContent='E-mail ou senha incorretos.';return}entrar()};
  $('#sair').onclick=async()=>{await sb.auth.signOut();pedirLogin()};
  const{data:{session}}=await sb.auth.getSession();session?entrar():pedirLogin();
})();
// Recarrega os dados quando o site volta a ficar visível (ex.: mudou algo no celular)
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&ready&&!$('#modal-root').innerHTML){try{await loadAll();render()}catch(e){}}});
setInterval(()=>{if(ready&&!$('#modal-root').innerHTML&&document.visibilityState==='visible')render()},60000);
</script>
